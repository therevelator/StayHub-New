name: E2E Tests

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stayhub
          POSTGRES_PASSWORD: stayhub
          POSTGRES_DB: stayhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U stayhub -d stayhub"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      # Backend. Everything uses 127.0.0.1 (explicit IPv4) so the dev server,
      # wait-on and Cypress's Chrome all agree on the address — `localhost` can
      # resolve to IPv6 for one tool and IPv4 for another, which makes cy.visit
      # fail with "could not load" even though the server is up.
      PORT: 5001
      NODE_ENV: development
      DB_HOST: 127.0.0.1
      DB_USER: stayhub
      DB_PASSWORD: stayhub
      DB_NAME: stayhub
      DB_PORT: 5432
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: http://127.0.0.1:3000
      # Frontend — must point at the backend above
      VITE_API_URL: http://127.0.0.1:5001/api
      # Cypress talks to the backend directly for setup/teardown
      CYPRESS_apiUrl: http://127.0.0.1:5001/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      # The postgres service is already healthy here (see health-cmd above).
      - name: Load database schema
        run: npm run db:init --prefix server

      - name: Run E2E tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          # Boots the client (127.0.0.1:3000) and the server (:5001) together.
          start: npm run start:ci
          wait-on: 'http://127.0.0.1:3000, http://127.0.0.1:5001/api/health'
          wait-on-timeout: 120
          browser: chrome
          config: baseUrl=http://127.0.0.1:3000

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
