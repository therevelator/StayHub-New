name: E2E Tests

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stayhub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      # Backend. Everything uses 127.0.0.1 (explicit IPv4) so the dev server,
      # wait-on and Cypress's Chrome all agree on the address — `localhost` can
      # resolve to IPv6 for one tool and IPv4 for another, which makes cy.visit
      # fail with "could not load" even though the server is up.
      PORT: 5001
      NODE_ENV: development
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: stayhub
      DB_PORT: 3306
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: http://127.0.0.1:3000
      # Frontend — must point at the backend above
      VITE_API_URL: http://127.0.0.1:5001/api
      # Cypress talks to the backend directly for setup/teardown
      CYPRESS_apiUrl: http://127.0.0.1:5001/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL and load schema
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent && break
            echo "waiting for mysql..."; sleep 2
          done
          mysql -h 127.0.0.1 -P 3306 -uroot -proot stayhub < server/src/db/schema.sql
          echo "schema loaded"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Run E2E tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          # Boots the client (127.0.0.1:3000) and the server (:5001) together.
          start: npm run start:ci
          wait-on: 'http://127.0.0.1:3000, http://127.0.0.1:5001/api/health'
          wait-on-timeout: 120
          browser: chrome
          config: baseUrl=http://127.0.0.1:3000

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
